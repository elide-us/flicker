[package]
name = "flicker-field-viewer"
version = "0.1.0"
edition.workspace = true
publish = false

# The instanced GPU-skinning "field viewer". Draws the whole animation library as a
# FIELD of characters — one instance per clip — each skinned on the GPU and drawn in a
# single instanced draw call (flicker-render's SkinnedMeshPipeline via
# Renderer::draw_skinned_instanced). Reuses the flicker-animation Katanami rig + 91-clip
# assets (no duplication). Slice 1 = static poses (pipeline proof); animation, spatial
# graph layout, fly camera, and active-node highlight are later slices.
# See docs/flicker-field-viewer-handoff.md.
[dependencies]
# Umbrella: flicker-app (App/run/InputState/Key) + flicker-render (Renderer/Camera/the
# instanced-skinning pipeline + glam math re-exports).
flicker = { path = "../../crates/flicker" }
# The GPU-free skeletal-animation runtime (format/pose/skin) — same source the
# single-character viewer consumes.
flicker-skeletal.workspace = true
glam.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
