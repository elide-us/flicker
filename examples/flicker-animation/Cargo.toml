[package]
name = "flicker-animation"
version = "0.1.0"
edition.workspace = true
publish = false

# Skeletal-animation model-viewer POC. Loads the `flicker.rig` JSON emitted by the
# `fbximport` FBX converter (Part 1) and plays it back:
#   * Slice 1 — skeleton wireframe viewer (bone hierarchy sampled per tick, CPU
#     forward-kinematics, drawn via the existing lines pipeline). THE validation
#     milestone for the CPU-authoritative pose layer.
#   * Slice 2 (deferred) — CPU-skinned mesh via the existing lit-mesh pipeline.
# The animation runtime (format/pose/skin/state) now lives in the `flicker-skeletal`
# crate (Alpha/flicker-skeletal); this example is the viewer that consumes it. See
# docs/flicker-animation-handoff.md + docs/flicker-combat-animation-handoff.md.
[dependencies]
# Umbrella: re-exports flicker-app (App/run/InputState/Key) + flicker-render
# (Renderer/Camera/lines+mesh pipelines + glam math types).
flicker = { path = "../../crates/flicker" }
# The GPU-free skeletal-animation runtime (format/pose/skin/state).
flicker-skeletal.workspace = true
glam.workspace = true
anyhow.workspace = true
# Decodes the converted albedo PNGs (assets/*.png) at load time for Slice 2 texturing.
image.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
