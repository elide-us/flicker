# Release — tag-triggered installers on GitHub Releases.
#
#   tag push vX.Y.Z          → full pipeline → published GitHub Release
#   workflow_dispatch        → dry run: builds + verifies everything, uploads
#                              run artifacts, publishes NOTHING (flip dry_run
#                              to false on a tag ref to publish manually)
#
# Per-OS installers: MSI (WiX v5, wildcard-harvested), macOS pkg (.app bundle,
# pkgbuild/productbuild), deb (cargo-deb) — plus portable archives. Content
# ships as ONE store-only package.flk, packed ONCE on Linux (immune to Windows
# autocrlf checkout rewrites) and mounted by the engine at runtime.
#
# Runner floors: ubuntu-22.04 pins glibc 2.35 so Ubuntu 22.04 / Debian 12
# players aren't stranded (when GitHub retires the runner, move to a container
# build or accept the newer floor). macos-latest is arm64 ⇒ Apple Silicon only
# for now. Actions are SHA-pinned; Dependabot proposes bumps.
#
# Signing is GATED ON SECRETS: absent secrets ⇒ unsigned artifacts (the release
# body says so). Wire later without workflow edits by adding repo secrets:
#   WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD          (Authenticode PFX)
#   MACOS_CERT_P12_BASE64 / MACOS_CERT_P12_PASSWORD           (Developer ID app+installer)
#   MACOS_NOTARY_APPLE_ID / MACOS_NOTARY_TEAM_ID / MACOS_NOTARY_PASSWORD (notarytool)

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + verify only; do not publish a release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag↔version drift gate: every artifact stamps its version from the
  # prism-alpha crate, so the tag must equal that version — checked here, loud.
  gate:
    name: version gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Read crate version; assert tag matches
        run: |
          V=$(cargo metadata --no-deps --format-version 1 --locked \
              | jq -r '.packages[] | select(.name=="prism-alpha") | .version')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          case "$V" in 0.*|*-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; \
                       *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v$V" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} != crate version v$V — bump Alpha/prism-alpha/Cargo.toml or retag"
            exit 1
          fi

  # Pack the content tree ONCE, on Linux, and share the artifact with every
  # installer job.
  pack:
    name: pack content
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Warm toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build content-tool
        run: cargo build --release --locked -p flicker-content --bin content-tool
      - name: Pack + verify package.flk
        run: |
          target/release/content-tool pack Alpha/content/package dist/package.flk
          target/release/content-tool verify dist/package.flk Alpha/content/package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-flk
          path: dist/package.flk
          compression-level: 0

  windows:
    name: windows msi
    needs: [gate, pack]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Warm toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --release --locked -p prism-alpha
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-flk
          path: flk
      - name: Stage install layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\stage\content | Out-Null
          Copy-Item target\release\prism-alpha.exe dist\stage\
          Copy-Item Alpha\prism-alpha\packaging\content.json dist\stage\
          Copy-Item flk\package.flk dist\stage\content\
          Copy-Item -Recurse Alpha\content\sensorium dist\stage\content\sensorium
          Copy-Item -Recurse Alpha\content\data dist\stage\content\data
      - name: Layout smoke (the scene-folder panic channel)
        shell: pwsh
        run: |
          foreach ($f in @("dist\stage\prism-alpha.exe", "dist\stage\content.json",
                           "dist\stage\content\package.flk", "dist\stage\content\data\stringtable.json")) {
            if (!(Test-Path $f)) { throw "staged layout is missing $f" }
          }
          if (!(Get-ChildItem dist\stage\content\sensorium\scenes -Filter *.scene.json)) {
            throw "staged layout has no scene files — the shell would panic at startup"
          }
      - name: Sign exe (gated on secrets)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f cert.pfx /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" dist\stage\prism-alpha.exe
      - name: Build MSI (WiX v5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "5.*"
          wix --version
          wix build Alpha\prism-alpha\packaging\windows\prism-alpha.wxs `
            -d Version=$env:VERSION -d StageDir=$PWD\dist\stage `
            -arch x64 -o dist\prism-alpha-v$env:VERSION-x86_64-pc-windows-msvc.msi
      - name: Sign MSI (gated on secrets)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f cert.pfx /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" dist\prism-alpha-v$env:VERSION-x86_64-pc-windows-msvc.msi
      - name: MSI content smoke (admin extract, no elevation)
        shell: pwsh
        run: |
          $msi = Resolve-Path "dist\prism-alpha-v$env:VERSION-x86_64-pc-windows-msvc.msi"
          Start-Process msiexec -ArgumentList "/a `"$msi`" /qn TARGETDIR=$env:RUNNER_TEMP\extract" -Wait
          $root = Get-ChildItem -Recurse -Filter prism-alpha.exe $env:RUNNER_TEMP\extract | Select-Object -First 1
          if (!$root) { throw "MSI does not contain prism-alpha.exe" }
          $base = $root.DirectoryName
          foreach ($f in @("content.json", "content\package.flk", "content\data\stringtable.json")) {
            if (!(Test-Path (Join-Path $base $f))) { throw "MSI is missing $f" }
          }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\stage\* -DestinationPath dist\prism-alpha-v$env:VERSION-x86_64-pc-windows-msvc.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-artifacts
          path: |
            dist/*.msi
            dist/*.zip
          compression-level: 0

  macos:
    name: macos pkg (apple silicon)
    needs: [gate, pack]
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Warm toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --release --locked -p prism-alpha
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-flk
          path: flk
      - name: Stage PrismAlpha.app
        run: |
          APP=dist/PrismAlpha.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/content"
          cp target/release/prism-alpha "$APP/Contents/MacOS/"
          cp Alpha/prism-alpha/packaging/macos/content.json "$APP/Contents/MacOS/"
          sed "s/@VERSION@/$VERSION/g" Alpha/prism-alpha/packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp flk/package.flk "$APP/Contents/Resources/content/"
          cp -R Alpha/content/sensorium "$APP/Contents/Resources/content/"
          cp -R Alpha/content/data "$APP/Contents/Resources/content/"
      - name: Layout smoke (the scene-folder panic channel)
        run: |
          APP=dist/PrismAlpha.app
          for f in "Contents/MacOS/prism-alpha" "Contents/MacOS/content.json" \
                   "Contents/Resources/content/package.flk" \
                   "Contents/Resources/content/data/stringtable.json"; do
            [[ -f "$APP/$f" ]] || { echo "::error::staged app is missing $f"; exit 1; }
          done
          ls "$APP"/Contents/Resources/content/sensorium/scenes/*.scene.json > /dev/null \
            || { echo "::error::no scene files — the shell would panic at startup"; exit 1; }
      - name: Codesign .app (gated on secrets)
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          echo "$MACOS_CERT_P12_BASE64" | base64 -d > cert.p12
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security import cert.p12 -k ci.keychain -P "${{ secrets.MACOS_CERT_P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
          IDENTITY=$(security find-identity -v -p codesigning ci.keychain | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          codesign --force --options runtime --timestamp --sign "$IDENTITY" dist/PrismAlpha.app
      - name: Build pkg
        run: |
          pkgbuild --component dist/PrismAlpha.app --install-location /Applications \
            --identifier net.elideus.prism-alpha --version "$VERSION" dist/component.pkg
          productbuild --package dist/component.pkg \
            "dist/prism-alpha-v$VERSION-aarch64-apple-darwin.pkg"
          rm dist/component.pkg
      - name: Sign + notarize pkg and app (gated on secrets)
        if: env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_NOTARY_APPLE_ID != ''
        run: |
          PKG="dist/prism-alpha-v$VERSION-aarch64-apple-darwin.pkg"
          IDENTITY=$(security find-identity -v ci.keychain | awk -F'"' '/Developer ID Installer/ {print $2; exit}')
          productsign --sign "$IDENTITY" "$PKG" "$PKG.signed" && mv "$PKG.signed" "$PKG"
          xcrun notarytool submit "$PKG" --wait \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "${{ secrets.MACOS_NOTARY_TEAM_ID }}" \
            --password "${{ secrets.MACOS_NOTARY_PASSWORD }}"
          xcrun stapler staple "$PKG"
          xcrun stapler staple dist/PrismAlpha.app
      - name: pkg content smoke
        run: |
          PKG="dist/prism-alpha-v$VERSION-aarch64-apple-darwin.pkg"
          pkgutil --payload-files "$PKG" | grep -q "prism-alpha$" || { echo "::error::pkg missing the binary"; exit 1; }
          pkgutil --payload-files "$PKG" | grep -q "package.flk" || { echo "::error::pkg missing package.flk"; exit 1; }
          pkgutil --payload-files "$PKG" | grep -q "stringtable.json" || { echo "::error::pkg missing stringtable"; exit 1; }
      - name: Portable app zip (ditto preserves exec bits; staple-after would break it)
        run: |
          ditto -c -k --keepParent dist/PrismAlpha.app \
            "dist/prism-alpha-v$VERSION-aarch64-apple-darwin.app.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-artifacts
          path: |
            dist/*.pkg
            dist/*.app.zip
          compression-level: 0

  linux:
    name: linux deb (glibc 2.35 floor)
    needs: [gate, pack]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build deps
        timeout-minutes: 10
        run: |
          # Same azure-mirror hardening as ci.yml (keep the copies identical).
          for i in 1 2 3; do
            sudo timeout 180 apt-get update \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
              && break
            echo "apt-get update flaked (attempt $i/3)"; sleep 10
          done
          sudo apt-get install -y --no-install-recommends \
            libudev-dev pkg-config libwayland-dev libxkbcommon-dev libx11-dev
      - name: Warm toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --release --locked -p prism-alpha
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-flk
          path: flk
      - name: Stage install layout
        run: |
          mkdir -p dist/stage/content
          cp target/release/prism-alpha dist/stage/
          cp Alpha/prism-alpha/packaging/content.json dist/stage/
          cp flk/package.flk dist/stage/content/
          cp -R Alpha/content/sensorium dist/stage/content/sensorium
          cp -R Alpha/content/data dist/stage/content/data
      - name: Layout smoke (the scene-folder panic channel)
        run: |
          for f in prism-alpha content.json content/package.flk content/data/stringtable.json; do
            [[ -f "dist/stage/$f" ]] || { echo "::error::staged layout is missing $f"; exit 1; }
          done
          ls dist/stage/content/sensorium/scenes/*.scene.json > /dev/null \
            || { echo "::error::no scene files — the shell would panic at startup"; exit 1; }
      - name: Build deb (cargo-deb, pinned; assets read dist/stage/)
        run: |
          cargo install cargo-deb --version 3.7.0 --locked
          cargo deb -p prism-alpha --no-build --no-strip \
            -o "dist/prism-alpha-v$VERSION-x86_64-unknown-linux-gnu.deb"
      - name: deb content smoke
        run: |
          DEB="dist/prism-alpha-v$VERSION-x86_64-unknown-linux-gnu.deb"
          dpkg-deb -c "$DEB" | grep -q "opt/prism-alpha/prism-alpha$" || { echo "::error::deb missing the binary"; exit 1; }
          dpkg-deb -c "$DEB" | grep -q "opt/prism-alpha/content/package.flk" || { echo "::error::deb missing package.flk"; exit 1; }
          dpkg-deb -c "$DEB" | grep -q "opt/prism-alpha/content/sensorium/scenes/.*\.scene\.json" || { echo "::error::deb missing scene files"; exit 1; }
          dpkg-deb -c "$DEB" | grep -q "opt/prism-alpha/content/data/stringtable.json" || { echo "::error::deb missing stringtable"; exit 1; }
          dpkg-deb -c "$DEB" | grep -q "usr/share/applications/prism-alpha.desktop" || { echo "::error::deb missing desktop entry"; exit 1; }
          echo "Depends: $(dpkg-deb -f "$DEB" Depends)"
      - name: Portable tar.gz
        run: tar -C dist/stage -czf "dist/prism-alpha-v$VERSION-x86_64-unknown-linux-gnu.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-artifacts
          path: |
            dist/*.deb
            dist/*.tar.gz
          compression-level: 0

  release:
    name: publish github release
    timeout-minutes: 15
    needs: [gate, windows, macos, linux]
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ./* > SHA256SUMS
      - name: Release notes header
        run: |
          {
            echo "Prism Alpha ${{ github.ref_name }} — Windows (MSI), macOS (pkg, Apple Silicon), Linux (deb / tar.gz)."
            echo ""
            echo "> ⚠ These alpha builds are **unsigned**: Windows SmartScreen shows"
            echo "> \"unrecognized app\" (More info → Run anyway) and macOS requires"
            echo "> right-click → Open on first launch. Verify downloads against SHA256SUMS."
          } > notes.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ needs.gate.outputs.prerelease == 'true' }}
