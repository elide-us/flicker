[package]
name = "prism-alpha"
version = "0.1.0"
edition.workspace = true
publish = false

# prism-alpha — the unified Prism client shell (the single harness). One binary
# that hosts every Prism scene (Loomforge / Clayworks rigging benches / click
# trainer / solar-birth cinematic / voxel-cluster terrain / epoch sim) behind the
# shared front-end (splash → MODE MENU → scene → pause): the root menu lists the
# three play modes (Explore the World / Build the World / Developer Mode), each
# opening its tier-2 page (see `roster()` in src/main.rs for the realm map). The
# individual `flicker-*` crates remain thin entry points to the SAME scenes.

[[bin]]
name = "prism-alpha"
path = "src/main.rs"

[dependencies]
# The reusable front-end shell (splash/menu/settings/pause) + the SceneEntry registry.
flicker-shell.workspace = true
# The lib-ified scenes this launcher hosts (one `SceneEntry` each). Pack Editor is a
# raw `impl App`, not a `Scene` yet, so it is NOT here until it is converted.
flicker-atc = { path = "../crates/scenes/flicker-atc" }
flicker-clicktrainer = { path = "../crates/scenes/flicker-clicktrainer" }
flicker-controllertester = { path = "../crates/scenes/flicker-controllertester" }
flicker-solarbirth = { path = "../crates/scenes/flicker-solarbirth" }
flicker-loomforge = { path = "../crates/scenes/flicker-loomforge" }
flicker-pocclusters = { path = "../crates/scenes/flicker-pocclusters" }
flicker-assetpipeline = { path = "../crates/scenes/flicker-assetpipeline" }
flicker-godmode = { path = "../crates/scenes/flicker-godmode" }
flicker-sablework = { path = "../crates/scenes/flicker-sablework" }
flicker-quartermaster = { path = "../crates/scenes/flicker-quartermaster" }
# Declares this executable's content roots (content.json) before any scene loads.
flicker-content.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
