[package]
name = "flicker-materialview"
version = "0.1.12"
edition.workspace = true
license.workspace = true
publish = false

# The MATERIAL SAMPLE — the engine's lit-material surface filler: a material's maps on a
# turning sphere (or an upright plane) under the consumer's authored stage, drawn through
# the textured PBR path with a draw-time emissive gain. Promoted out of the MaterialBench's
# Lit view (its `lit.rs` deleted) so a second consumer — the Material Catalog's spheres —
# draws lit materials without copying the bench. Also home to what both consumers feed it:
# the bundle-map decode, the flat-PBR stand-in for a material that has no bundle, and the
# curated emissive glow palette.
[lib]
name = "flicker_materialview"
path = "src/lib.rs"

[dependencies]
# Umbrella: flicker-render (Renderer/FrameGraph/PbrMaps/StageDef) and flicker-widgets
# (the walker's `SurfaceSlot` a sample is seated in).
flicker = { version = "0.1.0", path = "../../core/flicker" }
# The ONE offscreen-target lifecycle every surface filler renders through
# (`GlobeView::render_pass` + its `Seat`) — the rig view and its doll take the same seam,
# so a sample's target is created, resized, composited and freed exactly as theirs are.
flicker-globe = { version = "0.1.12", path = "../flicker-globe" }
# The map-role vocabulary (`MapKind`): which map is which, and which is colour. Also the
# material GRAPH the graph view projects (`MaterialGraph::eval_order`, the output table).
flicker-texture.workspace = true
# The node-graph filler the graph view feeds: its card/edge shapes, its ink slots, its
# pointer sample and the one seat test (`rect_contains`).
flicker-canvas = { version = "0.1.12", path = "../flicker-canvas" }
# A promoted material's bundle on disk (`MaterialBundle`) — the decode's input.
flicker-content.workspace = true
# The material index row (`MaterialDef`, `RenderClass`) a flat sample stands in for.
flicker-materials.workspace = true
# PNG decode for a bundle's maps.
image.workspace = true
# The glow palette's data file.
serde_json.workspace = true
tracing.workspace = true
