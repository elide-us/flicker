[package]
name = "flicker-widgets"
version = "0.1.7"
edition.workspace = true
license.workspace = true
publish = false

# flicker-widgets — the engine's **UI toolkit** (the Rust component walker, which
# draws and hit-tests every control itself + templates/Surfaces/intents/stringtable
# + the Lua HUD render bridge + the ui_theme.json loaders) — the shared seam both
# flicker-shell and every client consume; the `flicker` umbrella re-exports it as
# `flicker::ui` (the retired `flicker-ui` shim crate is gone, S10).
[dependencies]
flicker-render.workspace = true
flicker-script.workspace = true
# The scene STACK MACHINE, for the scene-file loader (`scene_def`): a file's exits
# are spelled in the manager's own `GotoMode` and hand back its own `Transition`,
# so the authored vocabulary and the machine's cannot drift into two spellings of
# one concept. One-way edge: widgets → scene (scene depends on app/render/input,
# never on the UI toolkit), and the loader lives here because it needs the
# template registry.
flicker-scene.workspace = true
# The input event bus (+ its core model): the WalkerHandler adapter implements
# `flicker_input_router::InputHandler` so the walker is a router layer (spec §4/A).
# One-way edge: widgets → router → core; the router never depends on widgets (no cycle).
flicker-input-core.workspace = true
flicker-input-router.workspace = true
# Content-roots service (flicker-core::roots): the shared ui_theme.json path
# resolves through the ONE root knob instead of a per-crate manifest-dir climb.
# Deliberately flicker-core, NOT flicker-content — the UI toolkit must not drag
# the content pipeline's closure (ufbx, skeletal) into every client.
flicker-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
