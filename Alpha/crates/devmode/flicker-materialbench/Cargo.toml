[package]
name = "flicker-materialbench"
version = "0.1.12"
edition.workspace = true
license.workspace = true
publish = false

# MaterialBench — the MATERIAL DESIGNER: a node-graph editor over
# (formerly "Sablework" — renamed 2026-10-14 under the PascalCase <Purpose>Bench ruling; history in MCP.)
# `flicker-texture`'s v2 MaterialGraph — the node list, the graph canvas, the
# selected node's parameters and the output stage, over the tiled seven-map preview
# and the lit sample, with every control an ActionSignal so the whole designer is
# drivable from a pad. The six-voice rack survives as Roll (a rolled patch converts
# through `MaterialGraph::from_recipe`); the preset library is DATA — New, then the
# factory library `data/factory_materials.json`. Bakes run on a
# WORKER (the 2K baseline is ~360 ms and even the preview is ~10 ms — neither
# belongs on the frame thread), newest result wins. Its output lands in `staging/`
# for the Content Manager to promote, like every other pipeline bench.

[lib]
name = "flicker_materialbench"
path = "src/lib.rs"

[dependencies]
# Umbrella: flicker-app (InputState), flicker-render (Renderer/Vec2),
# flicker-scene (Scene/Transition), flicker-script (UiNode/Value), and
# flicker-widgets (the walker + WalkerHandler + the gates).
flicker = { version = "0.1.0", path = "../../core/flicker" }
# The input model + event bus: this bench declares its intents on the screen
# root and routes them through the router like every other screen.
flicker-input-core.workspace = true
flicker-input-router.workspace = true
# The reusable front-end shell (pause overlay, the shared popup modal the insertion
# menu opens through, the theme).
flicker-shell.workspace = true
# THE INSTRUMENT — the material graph and its evaluator, the rack it converts, the
# baker, the resolution ladder.
flicker-texture.workspace = true
# The node-graph editor filler the designer's canvas is (cards, ports, links, picks,
# pan/zoom), seated in the walker-reserved `mtl_canvas` surface. What a gesture MEANS
# stays here, in the dispatcher.
flicker-canvas.workspace = true
# The material vocabulary a recipe binds to.
flicker-materials.workspace = true
# The Lit view's engine filler — the material SAMPLE (shared sphere + plane, the PBR draw
# under the authored stage, the emissive gain) — and the curated glow palette it loads.
flicker-materialview.workspace = true
# The content ROOTS service (staging/ + data/) and the gz write seam. The bench
# asks where content lives; it never spells out a path.
flicker-content.workspace = true
# PNG encoding for the committed maps. flicker-texture stays format-free and
# hands back raw pixel buffers; turning those into a file is the bench's job.
image.workspace = true
# Off-main-thread bakes.
flicker-worker.workspace = true
tracing.workspace = true
serde_json.workspace = true
