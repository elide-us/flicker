[package]
name = "flicker-packagebench"
version = "0.1.12"
edition.workspace = true
license.workspace = true
publish = false

# PackageBench — the content air-traffic controller. A two-tab file
# (formerly "Quartermaster" — renamed 2026-10-14 under the PascalCase <Purpose>Bench ruling; history in MCP.)
# manager over the content trees: REVIEW what the ingest benches dropped into
# `staging/`, then PROMOTE it into `package/` (the tree the game reads) and
# record it in the package manifest. Controller-first: every navigation and
# mutation is an ActionSignal, so the whole bench is drivable from a pad, with
# multi-select and drag as a keyboard/mouse enhancement.

[lib]
name = "flicker_packagebench"
path = "src/lib.rs"

[dependencies]
# Umbrella: flicker-app (InputState), flicker-render (Renderer/Vec2),
# flicker-scene (Scene/Transition), flicker-script (UiNode/Value), and
# flicker-widgets (the walker + WalkerHandler + the gates).
flicker = { version = "0.1.0", path = "../../core/flicker" }
# The input model + event bus: this bench declares its intents on the screen
# root and routes them through the router like every other screen.
flicker-input-core.workspace = true
flicker-input-router.workspace = true
# The reusable front-end shell (pause overlay + theme).
flicker-shell.workspace = true
# The content domain: roots/staging, package-side classification, and the
# reversible file operations the bench's commands wrap.
flicker-content.workspace = true
# The material catalog's own vocabulary. A staged material bundle is named for
# the SLOT it defines, so the Review tab reads a slot id off a folder segment and
# weighs it by the ONE slot law (`slot_accepts`) with the class of the index row
# the slot binds (read from the catalog's own loader) — at review and at promote —
# all of which belong to the catalog.
# Taken DIRECTLY rather than through a flicker-content re-export: that crate
# does not own this vocabulary, and a door left open in it would be a second
# spelling of where the reserved boundary lives (D-CODEC).
flicker-materials.workspace = true
# The bundle's MAP SET has one owner: `flicker_texture::MapKind::ALL` says how
# many maps a finished bake leaves, so the Review tab's completeness check reads
# that arity from the crate that emits the maps rather than restating the
# number — and its DOCUMENT has one loader, `flicker_texture::load_material_json`
# (the v2 material graph MaterialBench commits, or a v1 recipe), which the Review
# tab reads the slot claim through. flicker-texture is a pure CPU leaf
# (flicker-primitive + flicker-materials + serde) — it reaches no renderer.
flicker-texture.workspace = true
# The `.epoch` format's one home — the Review tab stands a staged world back up
# before it will let it be promoted.
flicker-worldengine.workspace = true
tracing.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The Goldberg tile count a synthetic `.epoch` fixture must span — taken from
# the grid's own formula, never a copied number.
flicker-worldgrid.workspace = true
