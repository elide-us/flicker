[package]
name = "flicker-worldtile"
version = "0.1.10"
edition.workspace = true
license.workspace = true
publish = false

# The PIXEL TIER. Turns a cell's aggregate — one column of strata — into the
# 2048² maps that are the world's truth from the migration onward, one pixel per
# voxel cluster. Reads the aggregate; owns no simulation of its own.
[lib]
name = "flicker_worldtile"
path = "src/lib.rs"

[dependencies]
flicker-poc-chemistry.workspace = true
flicker-worldgrid.workspace = true
glam.workspace = true
# The engine's world-defining constants: cluster span, the planet size
# model — what the atlas frame and the WorldClusterId are calibrated to.
clayengine.workspace = true
# The planet epoch (.epoch v2) — the Populous bench's committed world, the
# SOURCE the gameplay bake materializes tiles from.
flicker-worldengine.workspace = true
# The gz-at-rest seam the baked map planes ride (same as every artifact).
flicker-core.workspace = true
# The bake index — a small machine-read JSON header beside the planes.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
flicker-materials.workspace = true
