[package]
name = "flicker-worldengine"
version.workspace = true
edition.workspace = true
license.workspace = true

# THE PLANET'S HOME — the GPU-free crate a planet is simulated and stored in.
# Live: `Evolution`, the ten-phase tick driver that grows a world on a `HexMap`
# (seams → crust → plates → era), and `PlanetEpoch`, the `.epoch` v2 format it
# captures into and restores from. Frozen alongside them is the v1 toolbox
# (`WorldEngine`'s nine-epoch batch over the flicker-worldgen kernels,
# `Simulation`, and their v1 `EpochFile`) — kept engine inventory, no live
# consumers. Any scene reaches the planet sim by depending on this crate; it
# knows nothing about GPUs or windows.
[dependencies]
flicker-materials.workspace = true
flicker-worldstate.workspace = true
flicker-worldgen.workspace = true
flicker-worldgrid.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# THE shared compression routine (gzip + the gz-at-rest file seam) — `.epoch`
# load/save converged onto it (was a duplicate direct flate2 usage).
flicker-core.workspace = true
# The seam field's roll — the one random source, seeded so a world is
# reproducible from its seed.
fastrand.workspace = true
# The world-defining constants — the planet size model (TILE_MI, diameter) and
# the standard frequency the map opens at.
clayengine.workspace = true
