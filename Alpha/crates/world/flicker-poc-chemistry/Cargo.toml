[package]
name = "flicker-poc-chemistry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# The chemistry-first world sim — bulk-accretion budget, two conserved ledgers,
# reservoirs, columns, the steppable scheduler, and the conservation harness.
# **GPU-free and library-only**: the viewer MOVED into the `flicker-godmode` scene
# package hosted by the `prism-alpha` launcher (the same promotion
# `flicker-pocepochs` took), so nothing here knows a renderer exists.
[lib]
name = "flicker_poc_chemistry"
path = "src/lib.rs"

[dependencies]
flicker-worldgrid.workspace = true
flicker-worldstate.workspace = true
flicker-materials.workspace = true
flicker-worker.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
glam.workspace = true
