[package]
name = "flicker-worldgen"
version = "0.1.10"
edition.workspace = true
license.workspace = true

# The world-generation pipeline (system spec §13 "world-gen"): the offline
# epoch kernels that produce the foundational composition maps the runtime
# material model (flicker-worldstate, tier ②) then runs on. Depends on the
# vocabulary (flicker-materials) and the ledger types (flicker-worldstate);
# the runtime links none of it. All six epochs have landed: Epoch 1 seeds the
# per-hex element distribution and Epochs 2-6 differentiate the crust, lay the
# plates, flood the basins, mineralize the veins and erode the landscape.
[dependencies]
flicker-materials.workspace = true
flicker-worldstate.workspace = true
# The world-constant canon (tile span → tick derivation) — one source, per the
# canon-unanimity law; this crate must not carry its own typing of the span.
flicker-poc-chemistry.workspace = true
# The shared lattice noise (`noise.rs` here is only its Vec3 face).
flicker-primitive.workspace = true
glam.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Slice 2: prove the epoch chain runs on the real icosahedral topology
# (incl. the 5-neighbour pentagon) — the first consumer of the grid crate.
flicker-worldgrid.workspace = true
