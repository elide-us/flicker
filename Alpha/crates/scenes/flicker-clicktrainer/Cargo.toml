[package]
name = "flicker-clicktrainer"
version = "0.1.9"
edition.workspace = true
license.workspace = true
publish = false

# A minigame PACKAGE (library only) — the click-trainer `Scene`, driven by the
# unified `prism-alpha` launcher. No standalone binary; depends only on engine
# services (the `flicker` umbrella + the front-end shell for PauseScene/Theme).
[lib]
name = "flicker_clicktrainer"
path = "src/lib.rs"

[dependencies]
flicker = { version = "0.1.0", path = "../../core/flicker" }
# The new input model (Resolver/Fired/ActionSignal) + the event bus
# (Router/InputHandler/RouteCtx) this scene routes its Esc + click through (spec §9).
flicker-input-core.workspace = true
flicker-input-router.workspace = true
flicker-shell.workspace = true
fastrand.workspace = true
serde_json.workspace = true
tracing.workspace = true
