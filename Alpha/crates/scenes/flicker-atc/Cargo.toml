[package]
name = "flicker-atc"
version = "0.1.0"
edition.workspace = true
publish = false

# Air Traffic Control — a minigame PACKAGE (library only), hosted by the
# `prism-alpha` launcher on the Adventurer page. Like the Click Trainer this is a
# TECH DEMO, not Prism fiction: it exercises the 2D scope-drawing layer under a
# fully data-composed Prism UI (the canonical Quartermaster pattern — the scene
# emits ONE template instance, declares its intents, and expands once), and it is
# the reference for a game driven entirely by a DROPDOWN + DISPATCH command panel
# rather than by direct manipulation.

[lib]
name = "flicker_atc"
path = "src/lib.rs"

[dependencies]
# Umbrella: flicker-app (InputState), flicker-render (Renderer/Vec2),
# flicker-scene (Scene/Transition), flicker-script (UiNode/Value/HudCommand),
# flicker-widgets (the walker + templates + the drift gates).
flicker = { path = "../../core/flicker" }
# The input model + event bus: the screen declares its intents on the root and
# routes them through the router like every other Prism screen.
flicker-input-core.workspace = true
flicker-input-router.workspace = true
# The reusable front-end shell (pause overlay + theme).
flicker-shell.workspace = true
# The traffic roster / scenario rolls (seedable, so the sim tests are exact).
fastrand.workspace = true
serde_json.workspace = true
tracing.workspace = true
