[package]
name = "flicker-assetpipeline"
version = "0.1.0"
edition.workspace = true
publish = false

# The Asset Pipeline editor — the interactive HOST for `flicker-content`'s stages
# (scan → analyze → classify → conform → attach → bake). A library-only PACKAGE: the
# `Scene` is hosted by the unified `prism-alpha` launcher, no standalone binary.
# Exposes `scene()`. Design of record: DesignSync "Asset Processing Pipeline UI"
# (project 2fc44682-9c08-41a6-bb9f-c415471b15e9, "Asset Pipeline.dc.html");
# spec node A3A3259C.
[lib]
name = "flicker_assetpipeline"
path = "src/lib.rs"

[dependencies]
# Umbrella: app (InputState/Key) + render (Renderer/Camera/QuadGrid) + scene.
flicker = { path = "../../core/flicker" }
# The reusable front-end shell — this scene runs inside its pause overlay + theme.
flicker-shell.workspace = true
# THE pipeline stages this editor hosts. The editor owns no processing of its own.
flicker-content.workspace = true
# The rig format the pipeline reads and writes, plus pose/skin for the viewport.
flicker-skeletal.workspace = true
# Rig-view overlay geometry (joint segments / bone axes) + ray-vs-segment picking.
flicker-mechanics.workspace = true
# The shared input event bus + core resolver (spec section 9): this scene dispatches
# Esc->pause and the HUD pointer-consume through the router. Reused read-only — the
# bus is built and proven elsewhere; this crate only consumes it.
flicker-input-core.workspace = true
flicker-input-router.workspace = true
glam.workspace = true
# Native open-folder dialog for the Load step.
rfd.workspace = true
# Resolves the walker's node `style` paths against `ui_theme.json` (styles Value).
serde_json.workspace = true
# Skeleton-only deserialize of the fitting body (skips its mesh — GolemBase is ~50 MB).
serde.workspace = true
anyhow.workspace = true
tracing.workspace = true
# Decodes the source PNG maps for the TEXTURED fit preview — the same decoder the
# paperdoll uses, so the editor and the viewer read a vendor's maps identically.
image.workspace = true
