[package]
name = "flicker-populous"
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish = false

# Populous Bench — the world as a MAP, built up from nothing. It starts with one
# data structure (`HexMap`: tiles, each identified by its own index) and gains a
# layer only when a layer earns its place. A GAME MASTER scene: this is where a
# world is authored, not where an engine is tested.
[lib]
name = "flicker_populous"
path = "src/lib.rs"

[dependencies]
# The hex topology — the same icosphere the world simulation stands on.
flicker-worldgrid.workspace = true
# The shared hex-globe view: mesh builder + graticule + orbit camera + the
# offscreen viewport pass.
flicker-globe = { version = "0.1.0", path = "../../frontend/flicker-globe" }

flicker = { version = "0.1.0", path = "../../core/flicker" }
flicker-shell.workspace = true
# Input event bus — the shared resolve → route seam. The bench declares its
# intents on the screen root and routes them like every other screen.
flicker-input-core.workspace = true
flicker-input-router.workspace = true
tracing.workspace = true
# The scene holds the loaded `ui_theme.json` styles as a JSON value.
serde_json.workspace = true
