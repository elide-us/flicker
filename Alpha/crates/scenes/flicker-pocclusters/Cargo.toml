[package]
name = "flicker-pocclusters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# A CSG-cluster POC PACKAGE (library only) — the cluster-editor `Scene`, hosted by
# the unified `prism-alpha` launcher; no standalone binary. Exposes `scene()`.
[lib]
name = "flicker_pocclusters"
path = "src/lib.rs"

[dependencies]
flicker = { version = "0.1.0", path = "../../core/flicker" }
# The new input model (Resolver/Fired/EventKind/ActionSignal) + the event bus
# (Router/InputHandler/RouteCtx) this scene now routes all input through (spec §9).
flicker-input-core.workspace = true
flicker-input-router.workspace = true
# The reusable front-end shell (splash / menu / settings / pause) this scene runs
# inside; it also provides the pause overlay + theme.
flicker-shell.workspace = true
# The shared planet-layout model (roster + orbits) the from-Home sky draws.
flicker-orrery.workspace = true
flicker-voxel.workspace = true
# The gz-at-rest content seam (flicker-core::compression): cluster bakes are read by
# LOGICAL name (`cluster_X_Y_Z.json`), resolved gz-first through the shared routine.
flicker-core.workspace = true
flicker-worker.workspace = true
# The material catalog (materials.json) — colours for the mesh palette the
# voxel field renders with — resolved through the roots service.
flicker-materials.workspace = true
flicker-content.workspace = true
glam.workspace = true
# Resolves the walker's node `style` paths against `ui_theme.json` (styles Value).
serde_json.workspace = true
tracing.workspace = true
