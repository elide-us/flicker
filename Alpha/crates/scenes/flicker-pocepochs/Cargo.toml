[package]
name = "flicker-pocepochs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# The forward-regenerative epoch simulation as a scene PACKAGE (library only): the
# `WorldScene` drives a `flicker_worldengine` simulation — Epoch-1 seed + Epoch-2
# molten convection, icosphere globe, walker HUD. No standalone binary — the app
# MOVED into the unified `prism-alpha` launcher (a Developer-mode roster entry),
# which builds the scene via `flicker_pocepochs::scene`. Replaced the old
# single-hex retained layer-map POC (its water-cycle nucleus is re-homed in
# flicker-worldgen::water).
[lib]
name = "flicker_pocepochs"
path = "src/lib.rs"

[dependencies]
flicker = { version = "0.1.0", path = "../../core/flicker" }
# The content-roots service (flicker-core::roots): the shared HUD script path resolves through it.
flicker-core.workspace = true
# THE globe: the shell meshes, the authored stage, the offscreen target and the
# orbit camera. This bench carried its own copy of all four until they were
# folded back here (rule DDD070C7 — a third copy is what the next feature copies).
flicker-globe = { version = "0.1.0", path = "../../frontend/flicker-globe" }
flicker-input-core.workspace = true
flicker-input-router.workspace = true
flicker-shell.workspace = true
flicker-worldengine.workspace = true
serde_json.workspace = true
tracing.workspace = true
