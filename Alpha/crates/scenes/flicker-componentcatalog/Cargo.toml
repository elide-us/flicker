[package]
name = "flicker-componentcatalog"
version = "0.1.10"
edition.workspace = true
license.workspace = true
publish = false

# The UI TEST scene (library only) — a workbench that shows one demo copy of every
# Rust widget component with all features enabled, driven by the unified `prism-alpha`
# launcher. No standalone binary; depends only on engine services (the `flicker`
# umbrella + the front-end shell for PauseScene/Theme). A Developer-realm bench.
[lib]
name = "flicker_componentcatalog"
path = "src/lib.rs"

[dependencies]
flicker = { version = "0.1.0", path = "../../core/flicker" }
# The new input model + the event bus this scene routes its Esc + nav + clicks
# through (input-P3: no owned resolver — it dispatches the pump's `signals.events`).
flicker-input-core.workspace = true
flicker-input-router.workspace = true
# The shell: PauseScene/Theme, and the SHARED-MODAL host seam the Modals page
# exercises (`SharedModal::open` by id + `Scene::modal_closed`).
flicker-shell.workspace = true
# The SURFACE FILLERS the Fillers page seats live, each on a plain `surface`:
# GraphCanvas + Timeline from flicker-canvas, Gadget (over RigView) + Doll from
# flicker-rigview. `Plot` needs nothing new — it ships inside flicker-widgets,
# which the `flicker` umbrella already re-exports as `flicker::ui`.
flicker-canvas.workspace = true
flicker-rigview.workspace = true
# The gadget's feature BASIS is a `Mat3`, which `flicker::render` does not re-export.
glam.workspace = true
serde_json.workspace = true
tracing.workspace = true
