[package]
name = "flicker-jiggle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# Jiggle Bucket — a soft-body merge-dropper PACKAGE (library only), driven by the
# unified `prism-alpha` launcher. No standalone binary; depends only on engine
# services (the `flicker` umbrella + the front-end shell for PauseScene/Theme).
[lib]
name = "flicker_jiggle"
path = "src/lib.rs"

[dependencies]
flicker = { version = "0.1.0", path = "../../core/flicker" }
# The input model (Resolver/Fired/ActionSignal) + event bus (Router/InputHandler)
# this scene routes its rail-drop + Esc through (ALL INPUT IS SIGNALS).
flicker-input-core.workspace = true
flicker-input-router.workspace = true
flicker-shell.workspace = true
# Reused for the coarse ball-vs-ball overlap + merge query (Shape::Sphere + penetration);
# the pressurized soft-body solver itself is new (no 2D dynamics existed).
flicker-mechanics.workspace = true
glam.workspace = true
fastrand.workspace = true
serde_json.workspace = true
tracing.workspace = true
