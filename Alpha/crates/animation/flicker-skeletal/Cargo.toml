[package]
name = "flicker-skeletal"
version = "0.1.6"
edition.workspace = true
license.workspace = true
publish = false

# The CPU-authoritative skeletal-animation runtime: the `flicker.rig` format
# contract + loader (`format`), pose sampling / forward kinematics (`pose`), CPU
# linear-blend skinning (`skin`), and the animation/combat state machine + TAE
# event timeline (`state`). GPU-free and viewer-agnostic — the renderers
# (`flicker-assetpipeline`, `flicker-loomforge`, `flicker-controllertester`) and the
# mechanics/content tiers consume it as a crate.
# Extracted from `examples/flicker-animation` once the state-machine slice proved
# out. See docs/flicker-animation-handoff.md + docs/flicker-combat-animation-handoff.md.

[dependencies]
glam.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# The gz-at-rest content seam (flicker-core::compression): rig/clip/pack files are
# read by LOGICAL path (`.gz`-first, raw fallback) and packs are saved as gz.
flicker-core.workspace = true
