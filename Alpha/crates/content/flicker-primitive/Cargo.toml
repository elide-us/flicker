[package]
name = "flicker-primitive"
version = "0.1.9"
edition.workspace = true
license.workspace = true

# The primitive (stampable shape) layer: the source geometry the contour
# pipeline turns into voxel data, and the shapes the editor stamps into the
# world. Depends only on the `clayengine` foundation — never on voxel
# storage — so storage and primitives remain peers, neither owning the other.
[dependencies]
clayengine.workspace = true
