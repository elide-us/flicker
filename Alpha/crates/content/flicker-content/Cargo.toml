[package]
name = "flicker-content"
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish = false

# flicker-content — the in-app content pipeline (golden-spec WS-F, content-pipeline node A3A3259C).
# Point at a folder of raw sources → scan → classify → (FBX parse → canonical rig → bake) → the ONE
# flicker.rig, with NO external tools (Aaron 2026-07-21: in-app Rust FBX, not Blender/Python).
# This first slice is the INGEST stage — scan + classify + pick the riggable candidate(s), with the
# ">1 → let the user choose" guard. Pure std; the FBX parser + rigging + bake land in later slices.
# POC location (crates/) per the cluster migration policy; graduates once hardened.
[dependencies]
ufbx = "0.11.3"
anyhow.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# The canonical flicker.rig format types (RigFile/Skeleton/Mesh/…) live here; the bake writes them
# via their (now additive) Serialize derive — one schema, no parallel restatement.
flicker-skeletal.workspace = true
# THE shared compression routine (flicker-core::compression): the gz-at-rest read/write
# seam + gzip itself. `package` re-exports it; `content-tool gzify` converts through it.
flicker-core.workspace = true
# The store-only package container writer (`content-tool pack` → package.flk).
# No compression features compiled in — entries are Stored; the tree is already gz-at-rest.
zip.workspace = true

# The offline package-content tool (gzify / pack / verify).
[[bin]]
name = "content-tool"
path = "src/bin/content_tool.rs"
