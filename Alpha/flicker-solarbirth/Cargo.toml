[package]
name = "flicker-solarbirth"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "flicker-solarbirth"
path = "src/main.rs"

# A shell-client POC recovering the two keepers of the old emergent-formation
# `examples/flicker-solarsystem`: the **cinematic camera flight path** (opens
# outside the dust, glides into the inner system) and the **dust-cloud clearing**
# (inside-out dissipation + annular gaps at each planet's orbit). Everything
# emergent is gone — no random seed, no N-body, no material ledger. The system is
# the **fixed Prism canonical roster**: the sun, eight planets (seven schools +
# Home, which carries the moon), and Home's moon. Wired into flicker-shell.
[dependencies]
flicker = { path = "../../crates/flicker" }
flicker-shell.workspace = true
flicker-flight.workspace = true
glam.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
