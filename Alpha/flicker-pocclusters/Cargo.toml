[package]
name = "flicker-pocclusters"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "flicker-pocclusters"
path = "src/main.rs"

[dependencies]
flicker = { path = "../../crates/flicker" }
