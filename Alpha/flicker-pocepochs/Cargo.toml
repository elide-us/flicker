[package]
name = "flicker-pocepochs"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "flicker-pocepochs"
path = "src/main.rs"

# The application for the forward-regenerative epoch simulation: a flicker-shell
# client whose scene drives a `flicker_worldengine::WorldEngine`, scrubbing the nine
# epochs and (next) rendering the icosphere globe with the consolidated timeline UI.
# Replaced the old single-hex retained layer-map POC (its water-cycle nucleus is
# re-homed in flicker-worldgen::water). See docs/flicker-world-epoch-redesign*.md.
[dependencies]
flicker = { path = "../../crates/flicker" }
flicker-shell.workspace = true
flicker-worldengine.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
