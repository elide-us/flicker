[package]
name = "flicker-pocepochs"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "flicker-pocepochs"
path = "src/main.rs"

# A POC shell-client: one hex tile drawn as its full generation stack — the six
# world-gen epoch layers plus the atmosphere / water-cycle band stack — with a
# reseed button, all wired into flicker-shell. Recovered from the hex-world POC
# (which drew a whole map with the atmosphere/water-cycle bands toggled off); here
# it is a single hex with everything shown. Still POC.
[dependencies]
flicker = { path = "../../crates/flicker" }
flicker-shell.workspace = true
flicker-primitive.workspace = true
flicker-materials.workspace = true
flicker-worldstate.workspace = true
flicker-worldgen.workspace = true
glam.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
