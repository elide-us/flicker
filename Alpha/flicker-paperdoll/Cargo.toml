[package]
name = "flicker-paperdoll"
version = "0.1.0"
edition.workspace = true
publish = false

# flicker-paperdoll — the skeletal-animation "paperdoll" viewer: a character +
# rig + clip library dressed up and played back. Promoted from the old
# `examples/flicker-animation` POC into Alpha as a flicker-shell client. Loads the
# `flicker.rig` JSON emitted by the `fbximport` FBX converter and plays it back —
# skeleton wireframe, CPU-skinned mesh, textures, and a `.pack` state graph. The
# animation runtime (format/pose/skin/state) lives in the `flicker-skeletal` crate
# (Alpha/crates/animation/flicker-skeletal); this crate is the viewer that consumes it. See
# docs/flicker-animation-handoff.md + docs/flicker-combat-animation-handoff.md.
[dependencies]
# Umbrella: re-exports flicker-app (App/run/InputState/Key) + flicker-render
# (Renderer/Camera/lines+mesh pipelines + glam math types).
flicker = { path = "../../crates/flicker" }
# The reusable front-end shell (splash/menu/settings/pause) this viewer runs inside.
flicker-shell.workspace = true
# The GPU-free skeletal-animation runtime (format/pose/skin/state).
flicker-skeletal.workspace = true
glam.workspace = true
anyhow.workspace = true
# Decodes the converted albedo PNGs (assets/*.png) at load time for Slice 2 texturing.
image.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
