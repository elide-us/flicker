[workspace]
resolver = "2"
members = [
    # Alpha/ — everything required to run the application, organized as
    # Alpha/crates/<cluster>/<crate>.
    "Alpha/crates/core/clayengine",
    "Alpha/crates/core/flicker",
    "Alpha/crates/core/flicker-core",
    "Alpha/crates/core/flicker-worker",
    "Alpha/crates/platform/flicker-app",
    "Alpha/crates/render/flicker-render",
    "Alpha/crates/render/flicker-2d",
    "Alpha/crates/input/flicker-input-core",
    "Alpha/crates/input/flicker-input-router",
    "Alpha/crates/input/flicker-input-device",
    "Alpha/crates/net/flicker-net",
    "Alpha/crates/scripting/flicker-script",
    "Alpha/crates/frontend/flicker-scene",
    "Alpha/crates/frontend/flicker-shell",
    "Alpha/crates/frontend/flicker-widgets",
    "Alpha/crates/animation/flicker-flight",
    "Alpha/crates/animation/flicker-skeletal",
    "Alpha/crates/content/flicker-content",
    "Alpha/crates/content/flicker-materials",
    "Alpha/crates/content/flicker-primitive",
    "Alpha/crates/content/flicker-texture",
    "Alpha/crates/mechanics/flicker-mechanics",
    "Alpha/crates/world/flicker-voxel",
    # Game-package libraries (reusable client scenes hosted by prism-alpha).
    "Alpha/crates/scenes/flicker-clicktrainer",
    "Alpha/crates/scenes/flicker-controllertester",
    "Alpha/crates/frontend/flicker-globe",
    "Alpha/crates/scenes/flicker-godmode",
    "Alpha/crates/scenes/flicker-solarbirth",
    "Alpha/crates/scenes/flicker-loomforge",
    "Alpha/crates/scenes/flicker-assetpipeline",
    "Alpha/crates/scenes/flicker-pocclusters",
    "Alpha/crates/scenes/flicker-populous",
    "Alpha/crates/scenes/flicker-pocepochs",
    "Alpha/crates/scenes/flicker-quartermaster",
    "Alpha/crates/scenes/flicker-sablework",
    # The Prism-Alpha client (the app that hosts the scenes).
    "Alpha/prism-alpha",
    # World-sim / standalone POC crates — root crates/.
    "crates/flicker-worldstate",
    "crates/flicker-worldgen",
    "crates/flicker-worldengine",
    "crates/flicker-worldgrid",
    "crates/flicker-worldtile",
    "crates/flicker-poc-chemistry",
    "crates/flicker-celestial",
    "crates/flicker-system",
    "crates/flicker-world",
    "crates/flicker-greed",
    "crates/flicker-orrery",
    "crates/flicker-paperdoll",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elide-us/flicker"
authors = ["Aaron Stackpole <aaron@elideus.net>"]

[workspace.dependencies]
# Graphics & windowing
wgpu = "22"
winit = "0.30"
pollster = "0.4"

# Math
glam = { version = "0.29", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }

# Scripting
mlua = { version = "0.10", features = ["luau", "vendored", "async", "serialize"] }

# Async runtime (for net + async script bridge)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

# Networking
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes JSON float parsing bit-exact, so a `.epoch` capture (and
# any other serialized sim state) reloads to identical f64s — no per-load ULP drift.
serde_json = { version = "1", features = ["float_roundtrip"] }
bincode = "1"

# Compression — gzip for cluster bakes, wire packets, asset blobs.
# `rust_backend` keeps it pure-Rust (no zlib system dep); fine for our
# 5–100 KB chunks and small enough binary impact.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Image loading (for textures)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Text rendering (cosmic-text on wgpu). Pinned to a version that resolves on wgpu 22.
glyphon = "0.6"

# Small, dependency-free RNG used by example games.
fastrand = "2"

# Internal cross-crate deps
clayengine = { version = "0.1.0", path = "Alpha/crates/core/clayengine" }
flicker-materials = { version = "0.1.0", path = "Alpha/crates/content/flicker-materials" }
flicker-worldstate = { version = "0.1.0", path = "crates/flicker-worldstate" }
flicker-worldgen = { version = "0.1.0", path = "crates/flicker-worldgen" }
flicker-worldengine = { version = "0.1.0", path = "crates/flicker-worldengine" }
flicker-worldgrid = { version = "0.1.0", path = "crates/flicker-worldgrid" }
flicker-poc-chemistry = { version = "0.1.0", path = "crates/flicker-poc-chemistry" }
flicker-worldtile = { version = "0.1.0", path = "crates/flicker-worldtile" }
flicker-celestial = { version = "0.1.0", path = "crates/flicker-celestial" }
flicker-system = { version = "0.1.0", path = "crates/flicker-system" }
flicker-primitive = { version = "0.1.0", path = "Alpha/crates/content/flicker-primitive" }
flicker-texture = { version = "0.1.0", path = "Alpha/crates/content/flicker-texture" }
flicker-core = { version = "0.1.0", path = "Alpha/crates/core/flicker-core" }
# Input model + resolution leaf (spec §2). Router/device build on it.
flicker-input-core = { version = "0.1.0", path = "Alpha/crates/input/flicker-input-core" }
# Input event bus + focus + consumer API (spec §4). Depends only on flicker-input-core.
flicker-input-router = { version = "0.1.0", path = "Alpha/crates/input/flicker-input-router" }
# Platform input sources + the 120 Hz analog sampler (spec §6). The only input crate
# with OS/hw deps; fills the core snapshot/cache. Must not depend on flicker-app.
flicker-input-device = { version = "0.1.0", path = "Alpha/crates/input/flicker-input-device" }
flicker-render = { version = "0.1.0", path = "Alpha/crates/render/flicker-render" }
flicker-2d = { version = "0.1.0", path = "Alpha/crates/render/flicker-2d" }
flicker-script = { version = "0.1.0", path = "Alpha/crates/scripting/flicker-script" }
flicker-net = { version = "0.1.0", path = "Alpha/crates/net/flicker-net" }
flicker-app = { version = "0.1.0", path = "Alpha/crates/platform/flicker-app" }
flicker-scene = { version = "0.1.0", path = "Alpha/crates/frontend/flicker-scene" }
flicker-greed = { version = "0.1.0", path = "crates/flicker-greed" }
flicker-shell = { version = "0.1.0", path = "Alpha/crates/frontend/flicker-shell" }
flicker-widgets = { version = "0.1.0", path = "Alpha/crates/frontend/flicker-widgets" }
flicker-flight = { version = "0.1.0", path = "Alpha/crates/animation/flicker-flight" }
flicker-voxel = { version = "0.1.0", path = "Alpha/crates/world/flicker-voxel" }
flicker-worker = { version = "0.1.0", path = "Alpha/crates/core/flicker-worker" }
# Alpha crates (promoted, non-POC).
flicker-skeletal = { version = "0.1.0", path = "Alpha/crates/animation/flicker-skeletal" }
# mechanics cluster (collision/combat).
flicker-mechanics = { version = "0.1.0", path = "Alpha/crates/mechanics/flicker-mechanics" }
# in-app content pipeline (folder scan → FBX parse → canonical rig → bake).
flicker-content = { version = "0.1.0", path = "Alpha/crates/content/flicker-content" }
flicker-assetpipeline = { version = "0.1.0", path = "Alpha/crates/scenes/flicker-assetpipeline" }
# Native open-folder dialog for the Asset Pipeline editor's Load step.
rfd = "0.15"
# Shared GPU-free planet-layout model (the orrery) — the roster + orbits both the
# solar-birth cinematic and the heliocentric sky read (single source of truth).
flicker-orrery = { version = "0.1.0", path = "crates/flicker-orrery" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
