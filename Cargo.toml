[workspace]
resolver = "2"
members = [
    "crates/clayengine",
    "crates/flicker-materials",
    "crates/flicker-worldstate",
    "crates/flicker-worldgen",
    "crates/flicker-worldgrid",
    "crates/flicker-celestial",
    "crates/flicker-system",
    "crates/flicker-world",
    "crates/flicker-primitive",
    "crates/flicker-core",
    "crates/flicker-render",
    "crates/flicker-2d",
    "crates/flicker-script",
    "crates/flicker-net",
    "crates/flicker-app",
    "crates/flicker-scene",
    "crates/flicker-voxel",
    "crates/flicker-worker",
    "crates/flicker-ui",
    "crates/flicker",
    "examples/hello-sprite",
    "examples/square-chase",
    "examples/mesh-smoke",
    "examples/voxel-cluster",
    "examples/hex-world",
    "examples/hex-map",
    "examples/hex-sphere",
    "examples/flicker-solarsystem",
    "examples/flicker-sol2",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elide-us/flicker"
authors = ["Aaron Stackpole <aaron@elideus.net>"]

[workspace.dependencies]
# Graphics & windowing
wgpu = "22"
winit = "0.30"
pollster = "0.4"

# Math
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }

# Scripting
mlua = { version = "0.10", features = ["luau", "vendored", "async", "serialize"] }

# Async runtime (for net + async script bridge)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

# Networking
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Compression — gzip for cluster bakes, wire packets, asset blobs.
# `rust_backend` keeps it pure-Rust (no zlib system dep); fine for our
# 5–100 KB chunks and small enough binary impact.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Image loading (for textures)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Text rendering (cosmic-text on wgpu). Pinned to a version that resolves on wgpu 22.
glyphon = "0.6"

# Small, dependency-free RNG used by example games.
fastrand = "2"

# Internal cross-crate deps
clayengine = { version = "0.1.0", path = "crates/clayengine" }
flicker-materials = { version = "0.1.0", path = "crates/flicker-materials" }
flicker-worldstate = { version = "0.1.0", path = "crates/flicker-worldstate" }
flicker-worldgen = { version = "0.1.0", path = "crates/flicker-worldgen" }
flicker-worldgrid = { version = "0.1.0", path = "crates/flicker-worldgrid" }
flicker-celestial = { version = "0.1.0", path = "crates/flicker-celestial" }
flicker-system = { version = "0.1.0", path = "crates/flicker-system" }
flicker-primitive = { version = "0.1.0", path = "crates/flicker-primitive" }
flicker-core = { version = "0.1.0", path = "crates/flicker-core" }
flicker-render = { version = "0.1.0", path = "crates/flicker-render" }
flicker-2d = { version = "0.1.0", path = "crates/flicker-2d" }
flicker-script = { version = "0.1.0", path = "crates/flicker-script" }
flicker-net = { version = "0.1.0", path = "crates/flicker-net" }
flicker-app = { version = "0.1.0", path = "crates/flicker-app" }
flicker-scene = { version = "0.1.0", path = "crates/flicker-scene" }
flicker-voxel = { version = "0.1.0", path = "crates/flicker-voxel" }
flicker-worker = { version = "0.1.0", path = "crates/flicker-worker" }
flicker-ui = { version = "0.1.0", path = "crates/flicker-ui" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
