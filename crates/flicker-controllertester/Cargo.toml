[package]
name = "flicker-controllertester"
version = "0.1.0"
edition.workspace = true
publish = false

# A diagnostic PACKAGE (library only) — the Controller Tester `Scene`, driven by the
# unified `prism-alpha` launcher. Draws a live controller diagram (face buttons, d-pad,
# bumpers, triggers and sticks light up / move as you press them) plus a keyboard + mouse
# readout, using only engine services (the vector UI panel + text). No Lua HUD, so it
# touches no `ui_elements.json`.
[lib]
name = "flicker_controllertester"
path = "src/lib.rs"

[dependencies]
flicker = { path = "../flicker" }
flicker-shell.workspace = true
# The real input model + event bus this inspector drives (spec §10). Imported
# directly (not via the `flicker::app` bridge) so the tester exercises the same
# `flicker_input_core` / `flicker_input_router` surface the scenes do.
flicker-input-core.workspace = true
flicker-input-router.workspace = true
