[package]
name = "flicker-world"
version.workspace = true
edition.workspace = true
license.workspace = true

# The world application — an interactive viewer consolidating the app
# architecture from examples/hex-world + hex-map onto the icosahedral grid
# (flicker-worldgrid). Scene-based (loading → world); renders the sphere coloured
# by world-gen epoch fields with an orbit camera. The Lua UI and logo art are
# brought in next (still rough); this slice is the runnable viewer. Name not final.
[dependencies]
serde_json.workspace = true
flicker = { version = "0.1.0", path = "../../Alpha/crates/core/flicker" }
# Shared front-end shell (logo/menu/settings/pause + the Prism UI theme). The app
# routes through `flicker_shell::run`; no per-app shell/UI copy.
flicker-shell.workspace = true
# Input event bus (spec §4/§9): the Resolver -> Router seam the scene dispatches
# discrete edges (Menu -> pause) through, reusing the proven bus read-only.
flicker-input-core.workspace = true
flicker-input-router.workspace = true
flicker-worldgrid.workspace = true
flicker-worldgen.workspace = true
flicker-materials.workspace = true
glam.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
