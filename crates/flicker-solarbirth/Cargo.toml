[package]
name = "flicker-solarbirth"
version = "0.1.0"
edition.workspace = true
publish = false

# A cinematic PACKAGE (library only) — the Solar-Birth `Scene`, driven by the unified
# `prism-alpha` launcher; no standalone binary. Recovers the two keepers of the old
# emergent-formation `examples/flicker-solarsystem`: the **cinematic camera flight
# path** (opens outside the dust, glides into the inner system) and the **dust-cloud
# clearing** (inside-out dissipation + annular gaps at each planet's orbit). Everything
# emergent is gone; the system is the **fixed Prism canonical roster**.
[lib]
name = "flicker_solarbirth"
path = "src/lib.rs"

[dependencies]
flicker = { path = "../flicker" }
# The new input model (Resolver/Fired/ActionSignal) + the event bus (Router/
# InputHandler/RouteCtx) this scene routes its pause arbitration through (spec §9).
flicker-input-core.workspace = true
flicker-input-router.workspace = true
flicker-orrery.workspace = true
flicker-shell.workspace = true
flicker-flight.workspace = true
glam.workspace = true
serde_json.workspace = true
tracing.workspace = true
