[package]
name = "flicker-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flicker-core.workspace = true
flicker-render.workspace = true
flicker-2d.workspace = true
glam.workspace = true
winit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pollster.workspace = true
anyhow.workspace = true

# Gamepads: gilrs everywhere EXCEPT macOS, where its raw-IOKit-HID path enumerates Xbox
# pads but gets no input from them. macOS reads controllers through Apple's GameController
# framework instead (the path Unreal etc. use), via objc2.
[target.'cfg(not(target_os = "macos"))'.dependencies]
gilrs = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-game-controller = "0.3"
