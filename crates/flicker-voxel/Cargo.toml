[package]
name = "flicker-voxel"
version.workspace = true
edition.workspace = true
license.workspace = true

# `bytemuck` is the only third-party dependency — used to mark `Vertex`
# as `Pod`/`Zeroable` so a downstream graphics crate can cast a slice of
# vertices into its own GPU vertex type without copying. Storage and
# contouring are otherwise standard-library only.
[dependencies]
bytemuck.workspace = true
