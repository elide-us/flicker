[package]
name = "flicker-loomforge"
version = "0.1.0"
edition.workspace = true
publish = false

# flicker-loomforge — "Loomforge Bench", the animation-authoring editor. A four-tab
# bench (State Machine · Pack Browser · Creature Composer · TAE Editor) that READS AND
# WRITES `flicker.pack` JSON. Supersedes `flicker-packeditor`, which was a read-only
# pack VIEWER with no write path — its reusable parts (the live state-machine driving
# loop, the clip pose/palette preview, the state→node graph extraction) are salvaged
# here. The pack runtime (format/pose/skin/state) lives in `flicker-skeletal`; this
# crate is the editor that authors it.
#
# UI split (design decision): the surrounding chrome — tab bar, rails, lists,
# inspectors — is the `flicker-widgets` component walker; the node-graph canvas and TAE
# timeline are drawn by the scene itself (they need free 2D positioning, edges/curves,
# and drag-drop the closed walker has no components for).

# A library-only scene package, driven by the unified `prism-alpha` launcher.
[lib]
name = "flicker_loomforge"
path = "src/lib.rs"

[dependencies]
# Umbrella: re-exports flicker-app (App/InputState/Key), flicker-render (Renderer +
# glam math), flicker-scene (Scene/Transition), flicker-script (UiNode/HudCommand/
# Value), and flicker-ui (the component walker: run_ui/UiState/UiInput/render_hud).
flicker = { path = "../flicker" }
# The reusable front-end shell (splash/menu/settings/pause) this editor runs inside.
flicker-shell.workspace = true
# The GPU-free skeletal-animation runtime — the pack types this crate authors.
flicker-skeletal.workspace = true
glam.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde_json.workspace = true
